# =============================================================================
# spark-defaults.conf — monté en lecture seule dans tous les conteneurs Spark
# =============================================================================

# --- Cluster standalone -------------------------------------------------------
spark.master                                spark://spark-master:7077
spark.driver.memory                         2g
spark.executor.memory                       2g
spark.executor.cores                        2
# Plafond par application : permet à 2 applis (notebook + job streaming)
# de cohabiter sur les 8 cœurs du cluster. Surcharger à 8 si besoin.
spark.cores.max                             4
spark.sql.shuffle.partitions                8
spark.sql.session.timeZone                  UTC

# --- MinIO via S3A ------------------------------------------------------------
# Identifiants lus dans les variables AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (définies dans docker-compose.yml) : aucun secret dans ce fichier.
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# --- Delta Lake ---------------------------------------------------------------
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Event log (Spark History Server : DAG consultables après la fin d'un job)
spark.eventLog.enabled                      true
spark.eventLog.dir                          file:///opt/spark/spark-events
spark.history.fs.logDirectory               file:///opt/spark/spark-events
